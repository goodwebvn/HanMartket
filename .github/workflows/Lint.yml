name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Limit matrix to PHP versions supported by php-cs-fixer (<= 8.3)
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, cs2pr

      - name: Lint PHP Files
        run: |
          if find upload -type f -name "*.php" ! -path 'upload/system/storage/vendor/*' -exec php -l -n {} + | grep -q "Errors parsing"; then
            echo "Syntax errors were found."
            exit 1
          else
            echo "No syntax errors were detected."
          fi

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/composer/files
            ./.cache
            ./.php-cs-fixer.cache
          key: ${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-

      - name: Install Dependencies
        run: composer install

      - name: Check Code Style
        # Run code style checks only on PHP 8.3 (php-cs-fixer supports up to 8.3)
        if: matrix.php == '8.3'
        run: |
          set -euo pipefail

          # First run a dry run to show diffs (non-fatal). Keep this for visibility.
          php tools/php-cs-fixer.phar fix --dry-run --diff --ansi || true

          # Produce checkstyle XML and only pipe to cs2pr if any output is produced.
          XML_OUTPUT=$(php tools/php-cs-fixer.phar fix --dry-run --format=checkstyle 2>/dev/null || true)

          if [ -n "$XML_OUTPUT" ]; then
            echo "$XML_OUTPUT" | cs2pr
          else
            echo "php-cs-fixer produced no checkstyle XML output (no issues or failed). Skipping cs2pr."
          fi

      - name: Run PHPStan
        run: php tools/phpstan.phar analyze --no-progress
