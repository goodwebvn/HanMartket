#Elastic Beanstalk Nginx Configuration File

user                    nginx;
error_log               /var/log/nginx/error.log warn;
pid                     /var/run/nginx.pid;
worker_processes        auto;
worker_rlimit_nofile    200000;

events {
    worker_connections  1024;
}

http {
    server_tokens off;

    include       /etc/nginx/mime.types;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

    types_hash_max_size 2048;
    types_hash_bucket_size 128;
    fastcgi_buffers 16 128k;
    fastcgi_buffer_size 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_max_temp_file_size 5M;
    server_names_hash_bucket_size 128;

    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] " $request " '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        '$request_time $upstream_response_time $host $server_name';

    include       conf.d/*.conf;

    map $http_upgrade $connection_upgrade {
        default     "upgrade";
    }

    # Map the LB forwarded proto to a HSTS header value. This ensures we only send
    # Strict-Transport-Security when the original client connection used HTTPS.
    map $http_x_forwarded_proto $hsts_header {
        default "";
        https "max-age=31536000; includeSubDomains";
    }

    server {
        listen  80;
        server_name martket.ap-southeast-1.elasticbeanstalk.com;

        # If the original request (via the load balancer) was not HTTPS, redirect
        # the client to the https URL. The ELB/ALB sets X-Forwarded-Proto to the
        # original protocol.
        if ($http_x_forwarded_proto != 'https') {
            return 301 https://$host$request_uri;
        }

        set $day   "-";
        set $month "-";
        set $year  "-";
        set $hour  "-";
        if ($time_local ~ "^(\d{2})/(\w{3})/(\d{4}):(\d{2})" ) {
            set $day $1;
            set $month $2;
            set $year $3;
            set $hour $4;
        }

        access_log    /var/log/nginx/access.log main;

        client_header_timeout 60;
        client_body_timeout   60;
        keepalive_timeout     60;
        client_body_buffer_size 128k;
        client_max_body_size 50M;
        gzip                  on;
        gzip_comp_level       4;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        # Send HSTS only when the original request was HTTPS (controlled by map above)
        add_header Strict-Transport-Security $hsts_header always;
        # Cho phép iframe từ chính domain, Google Ads vẫn chạy trong script tag
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Ngăn chặn MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        # COEP/COOP/CORP: chỉnh để Google Ads & GTM chạy
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;  # trước là credentialless → Google Ads lỗi
        add_header Cross-Origin-Opener-Policy "same-origin" always;    # trước same-site → có thể lỗi cross-origin
        add_header Cross-Origin-Resource-Policy "same-origin" always;  # trước same-site → có thể lỗi với iframe Google
        # XSS Protection: giữ
        add_header X-XSS-Protection "1; mode=block" always;

        include /etc/nginx/deny_ips.conf;
        error_page 403 =444 /forbidden;
        location = /forbidden {
            return 444;
        }

        # Include the Elastic Beanstalk generated locations
        include conf.d/elasticbeanstalk/*.conf;
    }
}
